[package]
name = "shadowcast-tauri-controller"
version = "0.1.0"
description = "Direct GENKI ShadowCast capture for Windows"
authors = ["masaki-shinkawa"]
edition = "2021"

[lib]
name = "shadowcast_tauri_controller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "pnm"] }
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serialport = "4.7"
tauri = { version = "2.11", features = [] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# JPEG analysis is exercised from `tauri dev`, where dependencies would otherwise
# be unoptimized and decode a 1280 x 720 MJPEG frame far below the 15 FPS budget.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3
